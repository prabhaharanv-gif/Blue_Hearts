<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0369A1" />
<title>TicketDesk</title>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="TicketDesk" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ── Login ───────────────────────────────────────────── -->
<div id="login" class="login">
  <div class="login-card">
    <div class="login-mark" aria-hidden="true">
      <svg viewBox="0 0 64 42" width="74" height="49">
        <defs>
          <linearGradient id="tk-fill" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#075985" />
            <stop offset="1" stop-color="#38BDF8" />
          </linearGradient>
          <!-- Punches the tear notches and perforation clean through, so the
               mark sits on a light or a dark card without a seam. -->
          <mask id="tk-cut">
            <rect width="64" height="42" rx="7" fill="#fff" />
            <circle cx="42" cy="0" r="6" />
            <circle cx="42" cy="42" r="6" />
            <line x1="42" y1="9.5" x2="42" y2="32.5" stroke="#000" stroke-width="2.6" stroke-dasharray="3.6 3.4" stroke-linecap="round" />
          </mask>
        </defs>
        <rect width="64" height="42" rx="7" fill="url(#tk-fill)" mask="url(#tk-cut)" />
      </svg>
    </div>
    <h1>TicketDesk</h1>
    <p class="login-sub">Enter your details to view a booking.</p>
    <form id="login-form" autocomplete="off">
      <input id="server-input" class="field hidden" type="url" placeholder="Server address" autocomplete="off" spellcheck="false" inputmode="url" />
      <input id="name-input" class="field" type="text" placeholder="Passenger name" maxlength="24" autocomplete="off" spellcheck="false" />
      <div id="pass-field" class="field pass-field hidden">
        <input id="pass-input" type="password" placeholder="Booking reference" maxlength="64" autocomplete="off" />
        <button id="eye-btn" class="eye" type="button" aria-label="Show booking reference" title="Show booking reference">
          <svg id="eye-open" viewBox="0 0 24 24" width="20" height="20"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M1.8 12S5.4 5.4 12 5.4 22.2 12 22.2 12 18.6 18.6 12 18.6 1.8 12 1.8 12Z"/><circle cx="12" cy="12" r="3.1" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
          <svg id="eye-shut" class="hidden" viewBox="0 0 24 24" width="20" height="20"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 4.5 19.5 20M9.6 9.7A3.1 3.1 0 0 0 12 15.1c.86 0 1.64-.35 2.2-.92M6.2 6.7C3.4 8.5 1.8 12 1.8 12s3.6 6.6 10.2 6.6c1.7 0 3.2-.44 4.5-1.1M9.9 5.7A9.7 9.7 0 0 1 12 5.4c6.6 0 10.2 6.6 10.2 6.6s-.9 1.7-2.6 3.3"/></svg>
        </button>
      </div>
      <button type="submit">Find booking</button>
    </form>
    <div id="login-error" class="login-error"></div>
    <button id="change-server" class="linkish hidden" type="button">Change server</button>
    <button id="install-btn" class="install-btn hidden" type="button">📲 Install as app</button>
  </div>
</div>

<!-- ── Chat ────────────────────────────────────────────── -->
<div id="app" class="app hidden">
  <header class="topbar">
    <div class="avatar" id="peer-avatar">·</div>
    <div class="peer">
      <div class="peer-name" id="peer-name">Waiting…</div>
      <div class="peer-status" id="peer-status">no one else here yet</div>
    </div>
    <button class="icon-btn" id="notify-btn" title="Notifications on" aria-label="Notifications on" aria-pressed="true">
      <svg id="bell-on" viewBox="0 0 24 24" width="21" height="21"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M18 9a6 6 0 1 0-12 0c0 5-2 6.5-2 6.5h16S18 14 18 9ZM13.7 19a2 2 0 0 1-3.4 0"/></svg>
      <svg id="bell-off" class="hidden" viewBox="0 0 24 24" width="21" height="21"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M18 9a6 6 0 0 0-9.3-5M6.2 6.3A6 6 0 0 0 6 9c0 5-2 6.5-2 6.5h13M13.7 19a2 2 0 0 1-3.4 0M3.5 3.5l17 17"/></svg>
    </button>
    <button class="icon-btn" id="theme-btn" title="Toggle dark mode" aria-label="Toggle dark mode">
      <svg viewBox="0 0 24 24" width="21" height="21"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36A5.39 5.39 0 0 1 12 3Z"/></svg>
    </button>
    <button class="icon-btn" id="clear-btn" title="Clear this chat" aria-label="Clear chat">
      <svg viewBox="0 0 24 24" width="21" height="21"><path fill="currentColor" d="M6 7h12l-1 13H7L6 7Zm3-3h6l1 2H8l1-2Z"/></svg>
    </button>
    <button class="icon-btn" id="logout-btn" title="Log out" aria-label="Log out">
      <svg viewBox="0 0 24 24" width="21" height="21"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M14.5 4.5H19a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-4.5M10 8l-4 4 4 4M6 12h9"/></svg>
    </button>
  </header>

  <main id="messages" class="messages"></main>

  <div id="reply-bar" class="reply-bar hidden">
    <div class="reply-strip"></div>
    <div class="reply-body">
      <div class="reply-name" id="reply-name"></div>
      <div class="reply-text" id="reply-text"></div>
    </div>
    <button class="icon-btn" id="reply-cancel" aria-label="Cancel reply">
      <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7 4.3 4.3l6.3 6.3 6.3-6.3z"/></svg>
    </button>
  </div>

  <div id="edit-bar" class="reply-bar edit-bar hidden">
    <div class="reply-strip"></div>
    <div class="reply-body">
      <div class="reply-name">Editing message</div>
      <div class="reply-text" id="edit-text"></div>
    </div>
    <button class="icon-btn" id="edit-cancel" aria-label="Stop editing">
      <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7 4.3 4.3l6.3 6.3 6.3-6.3z"/></svg>
    </button>
  </div>

  <div id="attach-tray" class="attach-tray hidden"></div>

  <footer class="composer">
    <div class="input-wrap">
      <button class="emoji-btn" id="emoji-btn" aria-label="Emoji">🙂</button>
      <textarea id="input" rows="1" placeholder="Type a message" maxlength="4000"></textarea>
      <button class="emoji-btn" id="attach-btn" aria-label="Attach a photo or file" title="Attach">
        <svg viewBox="0 0 24 24" width="21" height="21"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M20.5 11.4 12 19.9a5.1 5.1 0 0 1-7.2-7.2l8.5-8.5a3.4 3.4 0 0 1 4.8 4.8l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4l7.8-7.8"/></svg>
      </button>
      <input id="file-input" type="file" class="hidden" multiple />
    </div>
    <button class="send-btn" id="send-btn" aria-label="Send">
      <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </footer>

  <div id="emoji-panel" class="emoji-panel hidden"></div>

  <div id="lightbox" class="lightbox hidden">
    <img id="lightbox-img" alt="" />
  </div>
</div>

<script src="server-config.js"></script>
<script src="vendor/socket.io.min.js"></script>
<script src="app.js"></script>
</body>
</html>
